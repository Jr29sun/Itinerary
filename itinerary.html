<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>开封五日攻略 10.2–10.6</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{--bg:#eef2ef;--card:#fbfcfb;--ink:#1c2a2d;--sub:#5d6f72;--line:#cfdad6;--accent:#3f7f78;--accent-ink:#fff;--warn:#b4472f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1c;--card:#1a2427;--ink:#e6eeec;--sub:#94a8aa;--line:#2b3a3d;--accent:#7cbab2;--accent-ink:#0f1a1b;--warn:#e08a72}}
:root[data-theme="dark"]{--bg:#121a1c;--card:#1a2427;--ink:#e6eeec;--sub:#94a8aa;--line:#2b3a3d;--accent:#7cbab2;--accent-ink:#0f1a1b;--warn:#e08a72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Serif SC","Songti SC","STSong",serif;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:30px;line-height:1.25;margin:8px 0 4px;letter-spacing:.08em}
.lead{color:var(--sub);margin:0 0 18px;font-size:14px}
.tabs{display:flex;gap:6px;padding:4px 0 8px;overflow-x:auto}
.tabs button{flex:1 0 auto;min-width:60px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;line-height:1.3;cursor:pointer}
.tabs button b{display:block;font-size:16px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h2{font-size:21px;margin:18px 0 2px}
.theme{color:var(--sub);font-size:14px;margin:0 0 12px}
ol{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
li{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px 10px}
li::before{content:"";position:absolute;left:-23px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
li.done{opacity:.55}li.done .n{text-decoration:line-through}
.row{display:flex;gap:10px;align-items:baseline}
.t{color:var(--accent);font-size:14px;min-width:54px;font-weight:700}
.n{font-weight:700;flex:1}
.d{margin:4px 0 0 64px;color:var(--sub);font-size:14px}
.chk{width:20px;height:20px;accent-color:var(--accent);flex:none;align-self:center}
input[type=text],textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{margin-top:6px;min-height:52px;resize:vertical}
.tin{width:84px!important;flex:none}
.tools{display:flex;gap:6px;margin-top:8px}
.tools button,.add,.bar button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.tools .del{color:var(--warn);margin-left:auto}
.add{width:100%;border-style:dashed;margin:2px 0 10px;padding:9px}
.tips{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--sub);margin-top:22px}
.tips b{color:var(--ink)}.tips ul{margin:6px 0 0;padding-left:18px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:9}
.bar button{padding:8px 14px;font-size:14px}
.bar .on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.show{opacity:1}

:root{--pend:#c9822b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pend:#e0a458}}
:root[data-theme="dark"]{--pend:#e0a458}
.nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:6px;padding:8px 0;z-index:6}
.nav button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px;font:inherit;cursor:pointer}
.nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mapbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px}
.mapbox svg{width:100%;height:auto;display:block}
.pin{cursor:pointer}.pin circle{stroke:var(--bg);stroke-width:2.5}
.pd circle{fill:var(--pend)}.dn circle{fill:var(--accent)}
.pin path{fill:none;stroke:var(--accent-ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.pin text{font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.pin:focus-visible circle{stroke:var(--ink)}
.wall{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:5 4}
.mini{font-size:10px;fill:var(--sub)}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin:10px 2px;color:var(--sub)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.addrow{display:flex;gap:8px;margin-bottom:12px}
.addrow button,.td button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 12px;cursor:pointer}
.td{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.td span{flex:1}.td.done span{text-decoration:line-through;opacity:.55}
.td button{color:var(--warn)}
</style>
</head>
<body>
<main>
<h1>开封五日</h1>
<p class="lead">10.2 周五 17:00 抵达 → 10.6 周二 14:00 结束。点底部「编辑行程」可随时改动,自动保存在本机。</p>
<div class="nav" id="nav"><button data-v="plan" aria-selected="true">行程</button><button data-v="map" aria-selected="false">地图</button><button data-v="todo" aria-selected="false">待办</button></div>
<section id="v-plan">
<div class="tabs" id="tabs" role="tablist"></div>
<div id="day"></div>
<div class="tips"><b>国庆提醒</b><ul>
<li>清明上河园、开封府、大相国寺提前线上订票</li>
<li>热门演出先看当天时间表</li>
<li>下雨就把开封博物馆提前,户外景点顺延</li>
<li>10.6 如需赶车,提前 1 到 1.5 小时到站</li></ul></div>
</section>
<section id="v-map" hidden>
<h2>打卡地图</h2>
<p class="theme" id="mc"></p>
<div class="mapbox"><svg viewBox="0 0 320 380" role="img" aria-label="开封景点示意图">
<rect x="92" y="62" width="170" height="200" rx="10" class="wall"/>
<text x="177" y="256" class="mini" text-anchor="middle">古城(示意)</text>
<line x1="150" y1="262" x2="100" y2="326" class="wall"/>
<text x="140" y="300" class="mini">约 20 公里</text>
<g id="pins"></g></svg></div>
<div class="lg"><span><i style="background:var(--pend)"></i>待打卡</span><span><i style="background:var(--accent)"></i>已打卡(带勾)</span></div>
<p class="theme" id="mp"></p>
<p class="theme">点地图上的景点可直接标记打卡,和行程里的勾选同步。位置为示意,非精确比例。</p>
</section>
<section id="v-todo" hidden>
<h2>待办事项</h2>
<p class="theme" id="tdc"></p>
<div class="addrow"><input type="text" id="tdin" placeholder="添加待办,回车确认"><button id="tdadd">添加</button></div>
<div id="tdl"></div>
</section>
</main>
<div class="bar">
<button id="edit">编辑行程</button>
<button id="copy">复制全文</button>
<button id="reset">恢复原版</button>
</div>
<div class="toast" id="toast"></div>
<script>
var DEF=[
{d:"10.2 周五",s:"傍晚抵达",h:"抵达与夜市",i:[
["17:00","抵达、入住","建议住鼓楼或龙亭附近,后面几天出行方便"],
["19:00","逛鼓楼夜市","灌汤包、花生糕、羊肉汤"]]},
{d:"10.3 周六",s:"包公皇城",h:"包公与皇城线",i:[
["09:00","开封府","留意包公断案等演出时间"],
["12:00","附近午饭",""],
["14:00","开封包公祠","包公湖畔,环境安静"],
["15:30","龙亭公园","北宋皇宫旧址,登殿俯瞰古城"],
["17:30","天波杨府","杨家将主题府邸与演绎"],
["19:00","自由安排 / 再逛夜市",""]]},
{d:"10.4 周日",s:"古寺古塔",h:"古寺古塔线",i:[
["09:00","大相国寺","中原名刹,千手千眼观音像"],
["12:00","午饭",""],
["14:00","铁塔公园","琉璃砖砌成,色似铁,天下第一塔"],
["16:00","开封博物馆","室内为主,人多或下雨时很合适"],
["18:30","书店街 / 鼓楼一带","晚上休息或随意逛"]]},
{d:"10.5 周一",s:"宋文化",h:"宋文化重头戏",i:[
["08:30","朱仙镇启封故园","离市区较远,早去早回;岳飞与木版年画"],
["12:30","午饭后回市区休息",""],
["15:00","清明上河园","占用时间最长,看完夜场再走"],
["20:00","清明上河园夜场","散场时间以当天公告为准"]]},
{d:"10.6 周二",s:"轻松收尾",h:"轻松收尾",i:[
["09:30","中国翰园碑林","书法碑刻,慢慢逛"],
["11:30","午饭",""],
["14:00","行程结束","如赶车,提前 1 到 1.5 小时到站"]]}];
var KEY="kf-plan-v1",data,cur=0,editing=false;
function clone(x){return JSON.parse(JSON.stringify(x))}
try{var s=localStorage.getItem(KEY);data=s?JSON.parse(s):clone(DEF)}catch(e){data=clone(DEF)}
if(!Array.isArray(data)||!data.length)data=clone(DEF);
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="toast show";setTimeout(function(){t.className="toast"},1600)}
function render(){
 document.getElementById("tabs").innerHTML=data.map(function(x,k){var p=x.d.split(" ");return '<button role="tab" data-tab="'+k+'" aria-selected="'+(k===cur)+'"><b>'+esc(p[0])+'</b>'+esc(p[1]||x.s)+'</button>'}).join("");
 var D=data[cur],h='<h2>'+esc(D.h)+'</h2><p class="theme">'+esc(D.d)+' · '+esc(D.s)+'</p><ol>';
 D.i.forEach(function(it,k){
  if(editing){
   h+='<li data-k="'+k+'"><div class="row"><input class="tin" type="text" data-f="0" value="'+esc(it[0])+'" aria-label="时间"><input type="text" data-f="1" value="'+esc(it[1])+'" aria-label="地点"></div><textarea data-f="2" aria-label="备注" placeholder="备注">'+esc(it[2])+'</textarea><div class="tools"><button data-a="up">上移</button><button data-a="dn">下移</button><button class="del" data-a="del">删除</button></div></li>';
  }else{
   h+='<li class="'+(it[3]?"done":"")+'" data-k="'+k+'"><div class="row"><span class="t">'+esc(it[0])+'</span><span class="n">'+esc(it[1])+'</span><input class="chk" type="checkbox" data-a="chk" '+(it[3]?"checked":"")+' aria-label="已完成"></div>'+(it[2]?'<div class="d">'+esc(it[2])+'</div>':"")+'</li>';
  }
 });
 h+='</ol>';
 if(editing)h+='<button class="add" data-a="add">+ 添加一项</button>';
 document.getElementById("day").innerHTML=h;
 var b=document.getElementById("edit");b.textContent=editing?"完成编辑":"编辑行程";b.className=editing?"on":"";
 renderMap();
}
document.getElementById("tabs").onclick=function(e){var b=e.target.closest("[data-tab]");if(b){cur=+b.dataset.tab;render()}};
var day=document.getElementById("day");
day.onclick=function(e){
 var a=e.target.closest("[data-a]");if(!a)return;
 var li=a.closest("li"),k=li?+li.dataset.k:-1,L=data[cur].i,act=a.dataset.a;
 if(act==="chk"){L[k][3]=a.checked?1:0}
 else if(act==="add"){L.push(["","新安排",""])}
 else if(act==="del"){if(confirm("删除这一项?"))L.splice(k,1);else return}
 else if(act==="up"&&k>0){var t=L[k];L[k]=L[k-1];L[k-1]=t}
 else if(act==="dn"&&k<L.length-1){var t2=L[k];L[k]=L[k+1];L[k+1]=t2}
 save();render();
};
day.oninput=function(e){
 var f=e.target.dataset.f,li=e.target.closest("li");
 if(f==null||!li)return;
 data[cur].i[+li.dataset.k][+f]=e.target.value;save();
};
document.getElementById("edit").onclick=function(){editing=!editing;render();if(!editing)toast("已保存")};
document.getElementById("reset").onclick=function(){if(confirm("恢复为最初的行程?你的修改会丢失。")){data=clone(DEF);save();render();toast("已恢复")}};
document.getElementById("copy").onclick=function(){
 var tx=data.map(function(D){return D.d+" "+D.h+"\n"+D.i.map(function(it){return (it[0]?it[0]+" ":"")+it[1]+(it[2]?"("+it[2]+")":"")}).join("\n")}).join("\n\n");
 try{navigator.clipboard.writeText(tx).then(function(){toast("已复制")},function(){toast("复制失败")})}catch(e){toast("复制失败")}
};

var PL=[["清明上河园","清明上河园",55,105],["龙亭公园","龙亭",165,92],["天波杨府","天波杨府",120,122],["开封博物馆","开封博物馆",215,128],["开封府","开封府",160,155],["开封包公祠","包公祠",105,168],["大相国寺","大相国寺",200,198],["铁塔公园","铁塔",245,85],["中国翰园碑林","翰园",58,210],["朱仙镇启封故园","朱仙镇",95,335]];
function matches(key){var r=[];data.forEach(function(D){D.i.forEach(function(it){if(String(it[1]).indexOf(key)>-1)r.push(it)})});return r}
function isDone(m){return m.length>0&&m.every(function(it){return it[3]})}
function renderMap(){
 var g="",n=0,pend=[];
 PL.forEach(function(p){var dn=isDone(matches(p[1]));if(dn)n++;else pend.push(p[0]);
  g+='<g class="pin '+(dn?"dn":"pd")+'" data-p="'+p[1]+'" tabindex="0" role="button" aria-label="'+p[0]+(dn?",已打卡":",待打卡")+'"><circle cx="'+p[2]+'" cy="'+p[3]+'" r="12"/>'+(dn?'<path d="M'+(p[2]-5)+' '+p[3]+'l4 4 7-8"/>':'')+'<text x="'+p[2]+'" y="'+(p[3]+27)+'" text-anchor="middle">'+p[0]+'</text></g>'});
 document.getElementById("pins").innerHTML=g;
 document.getElementById("mc").textContent="已打卡 "+n+" / "+PL.length;
 document.getElementById("mp").textContent=pend.length?"还没去:"+pend.join("、"):"全部打卡完成!";
}
function pinToggle(el){
 var g=el.closest(".pin");if(!g)return;
 var m=matches(g.dataset.p);
 if(!m.length){toast("行程里没有这个景点");return}
 var all=isDone(m);m.forEach(function(it){it[3]=all?0:1});save();render();toast(all?"已改为待打卡":"已打卡")
}
var svgEl=document.getElementById("pins");
svgEl.onclick=function(e){pinToggle(e.target)};
svgEl.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();pinToggle(e.target)}};
var TK="kf-todo-v1",todo=null;
try{var s2=localStorage.getItem(TK);todo=s2?JSON.parse(s2):null}catch(e){todo=null}
if(!Array.isArray(todo))todo=["预订 10.2–10.6 住宿","预订往返交通","提前订清明上河园门票和夜场","提前订开封府、大相国寺门票","确认热门演出时间表","带身份证、充电宝、雨具","10.6 预留赶车时间"].map(function(t){return{t:t,d:0}});
function saveT(){try{localStorage.setItem(TK,JSON.stringify(todo))}catch(e){}}
function renderTodo(){
 var n=todo.filter(function(x){return x.d}).length;
 document.getElementById("tdc").textContent="已完成 "+n+" / "+todo.length;
 document.getElementById("tdl").innerHTML=todo.map(function(x,k){return '<div class="td'+(x.d?" done":"")+'" data-k="'+k+'"><input class="chk" type="checkbox" data-a="tc" '+(x.d?"checked":"")+' aria-label="完成"><span>'+esc(x.t)+'</span><button data-a="tx">删除</button></div>'}).join("")||'<p class="theme">还没有待办,在上面添加一条。</p>';
}
document.getElementById("tdl").onclick=function(e){
 var a=e.target.closest("[data-a]"),r=e.target.closest(".td");if(!a||!r)return;
 var k=+r.dataset.k;
 if(a.dataset.a==="tc")todo[k].d=a.checked?1:0;else todo.splice(k,1);
 saveT();renderTodo();
};
function addTodo(){var i=document.getElementById("tdin"),v=i.value.trim();if(!v)return;todo.push({t:v,d:0});i.value="";saveT();renderTodo()}
document.getElementById("tdadd").onclick=addTodo;
document.getElementById("tdin").onkeydown=function(e){if(e.key==="Enter")addTodo()};
function show(v){
 ["plan","map","todo"].forEach(function(x){document.getElementById("v-"+x).hidden=x!==v});
 document.querySelectorAll("#nav button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.v===v)});
 document.querySelector(".bar").style.display=v==="plan"?"":"none";
 if(v==="map")renderMap();if(v==="todo")renderTodo();window.scrollTo(0,0);
}
document.getElementById("nav").onclick=function(e){var b=e.target.closest("[data-v]");if(b)show(b.dataset.v)};
render();
</script>
</body>
</html>
